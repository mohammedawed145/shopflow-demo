<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التصنيفات | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="app-body" data-page="categories">

  <div id="app-shell">
    <main class="app-content" id="app-content">

      <div class="page-header">
        <div>
          <div id="sf-breadcrumb"></div>
          <h1 class="page-title">التصنيفات</h1>
          <p class="page-subtitle">تنظيم المنتجات داخل مجموعات لتسهيل البحث والتصفية</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" type="button" id="btn-add-category">
            <i class="bi bi-plus-lg me-1"></i>إضافة تصنيف
          </button>
        </div>
      </div>

      <div class="card table-card">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>التصنيف</th>
                <th class="d-none d-md-table-cell">الوصف</th>
                <th>عدد المنتجات</th>
                <th class="cell-actions">إجراءات</th>
              </tr>
            </thead>
            <tbody id="categories-body"></tbody>
          </table>
        </div>
      </div>

      <!-- نافذة إضافة/تعديل تصنيف -->
      <div class="modal fade" id="category-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <form id="category-form" novalidate>
              <div class="modal-header">
                <h5 class="modal-title" id="category-modal-title"><i class="bi bi-tag me-1 text-primary"></i>إضافة تصنيف</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="category-id">
                <div class="mb-3">
                  <label class="form-label" for="category-name">اسم التصنيف <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="category-name" name="name" placeholder="مثال: إلكترونيات"
                         data-validate="required|min:2">
                </div>
                <div>
                  <label class="form-label" for="category-description">الوصف</label>
                  <textarea class="form-control" id="category-description" name="description" rows="2"
                            placeholder="وصف مختصر للتصنيف"></textarea>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-soft-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="submit" class="btn btn-primary" id="category-save-btn">حفظ التصنيف</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/products.js"></script>
</body>
</html>
