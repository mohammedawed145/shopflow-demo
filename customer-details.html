<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل العميل | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="app-body" data-page="customer-details">

  <div id="app-shell">
    <main class="app-content" id="app-content">

      <div class="page-header">
        <div>
          <div id="sf-breadcrumb"></div>
          <h1 class="page-title" id="customer-title">تفاصيل العميل</h1>
          <p class="page-subtitle">بيانات العميل وفواتيره وكشف حسابه</p>
        </div>
        <div class="page-actions no-print">
          <a class="btn btn-soft-secondary" href="customers.html"><i class="bi bi-arrow-right me-1"></i>العودة للعملاء</a>
          <button class="btn btn-primary" type="button" id="btn-print-statement">
            <i class="bi bi-printer me-1"></i>طباعة كشف الحساب
          </button>
        </div>
      </div>

      <div id="customer-details-box"></div>

      <div class="row g-3 mt-1">
        <!-- تسجيل دفعة -->
        <div class="col-lg-4 no-print">
          <div class="card h-100">
            <div class="card-header"><span><i class="bi bi-cash-coin text-success"></i>تسجيل دفعة</span></div>
            <div class="card-body">
              <form id="customer-payment-form" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="cd-payment-amount">المبلغ <span class="text-danger">*</span></label>
                  <input type="number" class="form-control" id="cd-payment-amount" name="amount" min="0" step="0.01"
                         placeholder="0.00" data-validate="required|number|minValue:0.01">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="cd-payment-method">طريقة الدفع</label>
                  <select class="form-select" id="cd-payment-method" name="method">
                    <option value="cash">نقدي</option>
                    <option value="card">بطاقة</option>
                    <option value="transfer">تحويل بنكي</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="cd-payment-date">التاريخ</label>
                  <input type="date" class="form-control" id="cd-payment-date" name="date">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="cd-payment-notes">ملاحظات</label>
                  <input type="text" class="form-control" id="cd-payment-notes" name="notes" placeholder="ملاحظة اختيارية">
                </div>
                <button type="submit" class="btn btn-success w-100" id="cd-payment-submit">
                  <i class="bi bi-check-lg me-1"></i>تسجيل الدفعة
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- فواتير العميل -->
        <div class="col-lg-8">
          <div class="card table-card h-100">
            <div class="card-header"><span><i class="bi bi-receipt"></i>فواتير العميل</span></div>
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>رقم الفاتورة</th>
                    <th class="d-none d-md-table-cell">التاريخ</th>
                    <th>الإجمالي</th>
                    <th class="d-none d-sm-table-cell">المدفوع</th>
                    <th class="d-none d-sm-table-cell">المتبقي</th>
                    <th class="d-none d-md-table-cell">الحالة</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="customer-invoices-body"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- كشف الحساب -->
        <div class="col-12">
          <div class="card" id="statement-card">
            <div class="card-header no-print">
              <span><i class="bi bi-file-earmark-text"></i>كشف الحساب</span>
              <span class="text-muted small">الفواتير (مدين) والدفعات (دائن) بالتسلسل الزمني</span>
            </div>
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>التاريخ</th>
                    <th>البيان</th>
                    <th>مدين</th>
                    <th>دائن</th>
                    <th>الرصيد</th>
                  </tr>
                </thead>
                <tbody id="statement-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/customers.js"></script>
</body>
</html>
