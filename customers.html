<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العملاء | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="app-body" data-page="customers">

  <div id="app-shell">
    <main class="app-content" id="app-content">

      <div class="page-header">
        <div>
          <div id="sf-breadcrumb"></div>
          <h1 class="page-title">العملاء</h1>
          <p class="page-subtitle">إدارة بيانات العملاء ومتابعة الديون والدفعات</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" type="button" id="btn-add-customer">
            <i class="bi bi-person-plus me-1"></i>إضافة عميل
          </button>
        </div>
      </div>

      <div class="card table-card">
        <div class="table-toolbar">
          <div class="toolbar-search">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control" id="customers-search" placeholder="ابحث بالاسم أو رقم الهاتف...">
          </div>
        </div>

        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>العميل</th>
                <th class="d-none d-md-table-cell">الهاتف</th>
                <th>إجمالي المشتريات</th>
                <th class="d-none d-sm-table-cell">المدفوع</th>
                <th>المتبقي</th>
                <th class="cell-actions">إجراءات</th>
              </tr>
            </thead>
            <tbody id="customers-body"></tbody>
          </table>
        </div>

        <div class="sf-pagination" id="customers-pagination"></div>
      </div>

      <!-- نافذة إضافة/تعديل عميل -->
      <div class="modal fade" id="customer-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <form id="customer-form" novalidate>
              <div class="modal-header">
                <h5 class="modal-title" id="customer-modal-title"><i class="bi bi-person-plus me-1 text-primary"></i>إضافة عميل</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="customer-id">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="customer-name">الاسم <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="customer-name" name="name" placeholder="مثال: أحمد محمد"
                           data-validate="required|min:2">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="customer-phone">رقم الهاتف <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control input-ltr" id="customer-phone" name="phone" placeholder="05xxxxxxxx"
                           data-validate="required|phone">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="customer-email">البريد الإلكتروني</label>
                    <input type="email" class="form-control input-ltr" id="customer-email" name="email" placeholder="name@example.com"
                           data-validate="email">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="customer-address">العنوان</label>
                    <input type="text" class="form-control" id="customer-address" name="address" placeholder="المدينة - الحي">
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="customer-notes">ملاحظات</label>
                    <textarea class="form-control" id="customer-notes" name="notes" rows="2" placeholder="ملاحظات إضافية عن العميل"></textarea>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-soft-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="submit" class="btn btn-primary" id="customer-save-btn">حفظ العميل</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- نافذة تسجيل دفعة -->
      <div class="modal fade" id="payment-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <form id="payment-form" novalidate>
              <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-cash-coin me-1 text-success"></i>تسجيل دفعة</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
              </div>
              <div class="modal-body">
                <p class="mb-3">العميل: <strong id="payment-customer-name"></strong>
                  <span class="badge badge-soft-danger ms-2" id="payment-customer-debt"></span></p>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="payment-amount">المبلغ <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="payment-amount" name="amount" min="0" step="0.01"
                           placeholder="0.00" data-validate="required|number|minValue:0.01">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="payment-method">طريقة الدفع</label>
                    <select class="form-select" id="payment-method" name="method">
                      <option value="cash">نقدي</option>
                      <option value="card">بطاقة</option>
                      <option value="transfer">تحويل بنكي</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="payment-date">التاريخ</label>
                    <input type="date" class="form-control" id="payment-date" name="date">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="payment-notes">ملاحظات</label>
                    <input type="text" class="form-control" id="payment-notes" name="notes" placeholder="ملاحظة اختيارية">
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-soft-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="submit" class="btn btn-success" id="payment-save-btn"><i class="bi bi-check-lg me-1"></i>تسجيل الدفعة</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/customers.js"></script>
</body>
</html>
