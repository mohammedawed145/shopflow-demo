<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المصروفات | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="app-body" data-page="expenses">

  <div id="app-shell">
    <main class="app-content" id="app-content">

      <div class="page-header">
        <div>
          <div id="sf-breadcrumb"></div>
          <h1 class="page-title">المصروفات</h1>
          <p class="page-subtitle">تسجيل مصروفات المحل ومتابعتها حسب البند والفترة</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" type="button" id="btn-add-expense">
            <i class="bi bi-plus-lg me-1"></i>إضافة مصروف
          </button>
        </div>
      </div>

      <div class="row g-3 mb-4" id="expenses-summary"></div>

      <div class="card table-card">
        <div class="table-toolbar">
          <div class="toolbar-search">
            <i class="bi bi-calendar3"></i>
            <input type="date" class="form-control" id="expenses-from" title="من تاريخ" aria-label="من تاريخ">
          </div>
          <input type="date" class="form-control" id="expenses-to" title="إلى تاريخ" aria-label="إلى تاريخ" style="max-width:160px">
          <select class="form-select" id="expenses-category" aria-label="فلتر البند" style="max-width:180px">
            <option value="">كل البنود</option>
            <option value="إيجار">إيجار</option>
            <option value="رواتب">رواتب</option>
            <option value="فواتير">فواتير</option>
            <option value="صيانة">صيانة</option>
            <option value="تسويق">تسويق</option>
            <option value="شحن ونقل">شحن ونقل</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>

        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>البند</th>
                <th class="d-none d-md-table-cell">الملاحظات</th>
                <th>المبلغ</th>
                <th class="cell-actions">إجراءات</th>
              </tr>
            </thead>
            <tbody id="expenses-body"></tbody>
          </table>
        </div>

        <div class="sf-pagination" id="expenses-pagination"></div>
      </div>

      <!-- نافذة إضافة/تعديل مصروف -->
      <div class="modal fade" id="expense-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <form id="expense-form" novalidate>
              <div class="modal-header">
                <h5 class="modal-title" id="expense-modal-title"><i class="bi bi-cash-coin me-1 text-primary"></i>إضافة مصروف</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="expense-id">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="expense-date">التاريخ <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="expense-date" name="date" data-validate="required">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="expense-category">البند <span class="text-danger">*</span></label>
                    <select class="form-select" id="expense-category" name="category" data-validate="required">
                      <option value="">اختر البند...</option>
                      <option value="إيجار">إيجار</option>
                      <option value="رواتب">رواتب</option>
                      <option value="فواتير">فواتير</option>
                      <option value="صيانة">صيانة</option>
                      <option value="تسويق">تسويق</option>
                      <option value="شحن ونقل">شحن ونقل</option>
                      <option value="أخرى">أخرى</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="expense-amount">المبلغ <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="expense-amount" name="amount" min="0" step="0.01"
                           placeholder="0.00" data-validate="required|number|minValue:0.01">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="expense-notes">الملاحظات</label>
                    <input type="text" class="form-control" id="expense-notes" name="notes" placeholder="ملاحظة اختيارية">
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-soft-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="submit" class="btn btn-primary" id="expense-save-btn">حفظ المصروف</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/expenses.js"></script>
</body>
</html>
