<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-body" data-page="forgot-password">

  <div class="auth-wrapper">
    <div class="auth-brand">
      <div class="auth-logo"><img src="assets/images/logo.svg" alt="شعار ShopFlow"></div>
      <h1 class="auth-name">ShopFlow</h1>
      <p class="auth-tagline">استعادة الوصول إلى حسابك</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-card-title">نسيت كلمة المرور؟</h2>
      <p class="auth-card-sub">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور</p>

      <form id="forgot-form" novalidate>
        <div class="mb-4">
          <label class="form-label" for="forgot-email">البريد الإلكتروني</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control input-ltr" id="forgot-email" name="email"
                   placeholder="name@example.com" data-validate="required|email" autocomplete="email">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg" id="forgot-submit">
          <i class="bi bi-send me-1"></i>إرسال رابط الاستعادة
        </button>
      </form>

      <div class="alert alert-success d-none mt-4 mb-0" id="forgot-success" role="alert">
        <div class="d-flex align-items-start gap-2">
          <i class="bi bi-check-circle-fill fs-4"></i>
          <div>
            <strong>تم إرسال الطلب بنجاح!</strong>
            <p class="mb-1 mt-1">إذا كان البريد الإلكتروني مسجلًا لدينا فستصلك رسالة تحتوي على رابط إعادة تعيين كلمة المرور خلال دقائق.</p>
            <a href="login.html" class="fw-bold">العودة لتسجيل الدخول</a>
          </div>
        </div>
      </div>

      <div class="auth-footer-links">
        تذكرت كلمة المرور؟ <a href="login.html">تسجيل الدخول</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
</body>
</html>
