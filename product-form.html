<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة منتج | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="app-body" data-page="product-form">

  <div id="app-shell">
    <main class="app-content" id="app-content">

      <div class="page-header">
        <div>
          <div id="sf-breadcrumb"></div>
          <h1 class="page-title" id="form-page-title">إضافة منتج جديد</h1>
          <p class="page-subtitle">أدخل بيانات المنتج لعرضه في المتجر وإدارته في المخزون</p>
        </div>
        <div class="page-actions">
          <a class="btn btn-soft-secondary" href="products.html"><i class="bi bi-arrow-right me-1"></i>العودة للمنتجات</a>
        </div>
      </div>

      <form id="product-form" novalidate>
        <div class="row g-3">

          <div class="col-lg-8">
            <div class="card mb-3">
              <div class="card-header"><span><i class="bi bi-info-circle"></i>البيانات الأساسية</span></div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="pf-name">اسم المنتج <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="pf-name" name="name" placeholder="مثال: شاحن سريع 20 واط"
                           data-validate="required|min:2">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="pf-sku">رمز المنتج (SKU)</label>
                    <div class="input-group">
                      <input type="text" class="form-control input-ltr" id="pf-sku" name="sku" placeholder="SKU-1001">
                      <button class="btn btn-soft-primary" type="button" id="pf-sku-generate" title="توليد رمز تلقائي">
                        <i class="bi bi-magic"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="pf-category">التصنيف <span class="text-danger">*</span></label>
                    <select class="form-select" id="pf-category" name="category_id" data-validate="required">
                      <option value="">اختر التصنيف...</option>
                    </select>
                    <div class="form-text"><a href="categories.html">إدارة التصنيفات</a></div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="pf-description">الوصف</label>
                    <textarea class="form-control" id="pf-description" name="description" rows="2"
                              placeholder="وصف مختصر للمنتج يظهر في المتجر الإلكتروني"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="card mb-3">
              <div class="card-header"><span><i class="bi bi-sliders"></i>بيانات إضافية</span></div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label" for="pf-color">اللون</label>
                    <input type="text" class="form-control" id="pf-color" name="color" placeholder="مثال: أزرق">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="pf-size">المقاس</label>
                    <input type="text" class="form-control" id="pf-size" name="size" placeholder="مثال: M / 42">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="pf-material">الخامة</label>
                    <input type="text" class="form-control" id="pf-material" name="material" placeholder="مثال: قطن">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card mb-3">
              <div class="card-header"><span><i class="bi bi-cash-stack"></i>الأسعار والمخزون</span></div>
              <div class="card-body">
                <div class="mb-3">
                  <label class="form-label" for="pf-cost">سعر الشراء <span class="text-danger">*</span></label>
                  <input type="number" class="form-control" id="pf-cost" name="cost" min="0" step="0.01"
                         placeholder="0.00" data-validate="required|number|minValue:0">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="pf-price">سعر البيع <span class="text-danger">*</span></label>
                  <input type="number" class="form-control" id="pf-price" name="price" min="0" step="0.01"
                         placeholder="0.00" data-validate="required|number|minValue:0">
                  <div class="form-text" id="pf-margin-hint"></div>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="pf-quantity">الكمية <span class="text-danger">*</span></label>
                  <input type="number" class="form-control" id="pf-quantity" name="quantity" min="0" step="1"
                         placeholder="0" data-validate="required|integer|minValue:0">
                </div>
                <div>
                  <label class="form-label" for="pf-min-stock">الحد الأدنى للمخزون</label>
                  <input type="number" class="form-control" id="pf-min-stock" name="min_stock" min="0" step="1"
                         placeholder="0" data-validate="integer|minValue:0">
                  <div class="form-text">يظهر تنبيه عندما تقل الكمية عن هذا الحد</div>
                </div>
              </div>
            </div>

            <div class="card mb-3">
              <div class="card-header"><span><i class="bi bi-image"></i>صورة المنتج</span></div>
              <div class="card-body">
                <div class="text-center mb-3">
                  <span class="cell-thumb" id="pf-image-preview" style="width:110px;height:110px;border-radius:14px">
                    <i class="bi bi-image" style="font-size:2rem"></i>
                  </span>
                </div>
                <label class="form-label" for="pf-image">رابط الصورة</label>
                <input type="url" class="form-control input-ltr" id="pf-image" name="image"
                       placeholder="https://example.com/image.jpg">
                <div class="d-flex gap-2 mt-2">
                  <button type="button" class="btn btn-soft-secondary btn-sm flex-fill" id="pf-image-upload">
                    <i class="bi bi-upload me-1"></i>رفع من الجهاز
                  </button>
                  <button type="button" class="btn btn-soft-secondary btn-sm" id="pf-image-remove" title="إزالة الصورة">
                    <i class="bi bi-x-lg"></i>
                  </button>
                </div>
                <input type="file" id="pf-image-file" accept="image/*" class="d-none">
                <div class="form-text">بحد أقصى 400 كيلوبايت — تُخزن الصورة المرفوعة كـ Base64</div>
              </div>
            </div>

            <div class="card">
              <div class="card-body d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg" id="pf-submit">
                  <i class="bi bi-check-lg me-1"></i>حفظ المنتج
                </button>
                <a class="btn btn-soft-secondary" href="products.html">إلغاء</a>
              </div>
            </div>
          </div>

        </div>
      </form>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/products.js"></script>
</body>
</html>
