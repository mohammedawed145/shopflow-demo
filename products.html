<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتجات | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="app-body" data-page="products">

  <div id="app-shell">
    <main class="app-content" id="app-content">

      <div class="page-header">
        <div>
          <div id="sf-breadcrumb"></div>
          <h1 class="page-title">المنتجات</h1>
          <p class="page-subtitle">إدارة منتجات المتجر والمخزون والأسعار</p>
        </div>
        <div class="page-actions">
          <a class="btn btn-primary" href="product-form.html"><i class="bi bi-plus-lg me-1"></i>إضافة منتج</a>
        </div>
      </div>

      <div class="card table-card">
        <div class="table-toolbar">
          <div class="toolbar-search">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control" id="products-search" placeholder="ابحث بالاسم أو رمز SKU...">
          </div>
          <select class="form-select" id="products-category-filter" aria-label="فلتر التصنيف">
            <option value="">كل التصنيفات</option>
          </select>
          <select class="form-select" id="products-stock-filter" aria-label="فلتر حالة المخزون">
            <option value="">كل حالات المخزون</option>
            <option value="in">متوفر</option>
            <option value="low">منخفض</option>
            <option value="out">نفد المخزون</option>
          </select>
        </div>

        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>المنتج</th>
                <th class="d-none d-md-table-cell">التصنيف</th>
                <th class="d-none d-lg-table-cell">سعر الشراء</th>
                <th>سعر البيع</th>
                <th>الكمية</th>
                <th class="d-none d-sm-table-cell">الحالة</th>
                <th class="cell-actions">إجراءات</th>
              </tr>
            </thead>
            <tbody id="products-body"></tbody>
          </table>
        </div>

        <div class="sf-pagination" id="products-pagination"></div>
      </div>

      <!-- نافذة تعديل المخزون -->
      <div class="modal fade" id="stock-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <form id="stock-form" novalidate>
              <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-boxes me-1 text-primary"></i>تعديل المخزون</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
              </div>
              <div class="modal-body">
                <p class="mb-2">المنتج: <strong id="stock-product-name"></strong></p>
                <div class="d-flex align-items-center gap-2 mb-3">
                  <span class="badge badge-soft-secondary" id="stock-current">—</span>
                  <i class="bi bi-arrow-left text-muted"></i>
                  <span class="badge badge-soft-primary" id="stock-new-preview">؟</span>
                </div>
                <label class="form-label" for="stock-quantity">الكمية الجديدة <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="stock-quantity" min="0" step="1"
                       data-validate="required|integer|minValue:0" placeholder="أدخل الكمية الإجمالية">
                <div class="form-text">أدخل الكمية الإجمالية الحالية في المخزون وليس المقدار المضاف</div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-soft-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="submit" class="btn btn-primary" id="stock-save-btn">حفظ المخزون</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/products.js"></script>
</body>
</html>
