<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-body" data-page="register">

  <div class="auth-wrapper wide">
    <div class="auth-brand">
      <div class="auth-logo"><img src="assets/images/logo.svg" alt="شعار ShopFlow"></div>
      <h1 class="auth-name">ShopFlow</h1>
      <p class="auth-tagline">أنشئ حسابك وابدأ إدارة محلك خلال دقائق</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-card-title">إنشاء حساب جديد</h2>
      <p class="auth-card-sub">املأ البيانات التالية لتسجيل محلك في النظام</p>

      <form id="register-form" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="reg-name">اسم المستخدم <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="reg-name" name="name" placeholder="مثال: محمد أحمد"
                   data-validate="required|min:3" autocomplete="name">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="reg-store">اسم المحل <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="reg-store" name="store_name" placeholder="مثال: متجر الأفق"
                   data-validate="required|min:2">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="reg-email">البريد الإلكتروني <span class="text-danger">*</span></label>
            <input type="email" class="form-control input-ltr" id="reg-email" name="email" placeholder="name@example.com"
                   data-validate="required|email" autocomplete="email">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="reg-phone">رقم الهاتف <span class="text-danger">*</span></label>
            <input type="tel" class="form-control input-ltr" id="reg-phone" name="phone" placeholder="05xxxxxxxx"
                   data-validate="required|phone" autocomplete="tel">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="reg-business">نوع النشاط <span class="text-danger">*</span></label>
            <select class="form-select" id="reg-business" name="business_type" data-validate="required">
              <option value="">اختر نوع النشاط...</option>
              <option value="grocery">بقالة / سوبرماركت</option>
              <option value="fashion">ملابس وأزياء</option>
              <option value="electronics">إلكترونيات</option>
              <option value="restaurant">مطعم / كافيه</option>
              <option value="pharmacy">صيدلية</option>
              <option value="perfumes">عطور ومستحضرات تجميل</option>
              <option value="other">أخرى</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="reg-address">العنوان</label>
            <input type="text" class="form-control" id="reg-address" name="address" placeholder="المدينة - الحي - الشارع">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="reg-password">كلمة المرور <span class="text-danger">*</span></label>
            <div class="position-relative">
              <input type="password" class="form-control" id="reg-password" name="password" placeholder="6 أحرف على الأقل"
                     data-validate="required|min:6" autocomplete="new-password">
              <button type="button" class="password-toggle" data-toggle-password="reg-password" aria-label="إظهار كلمة المرور">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="reg-confirm">تأكيد كلمة المرور <span class="text-danger">*</span></label>
            <div class="position-relative">
              <input type="password" class="form-control" id="reg-confirm" name="password_confirmation" placeholder="أعد كتابة كلمة المرور"
                     data-validate="required|match:#reg-password" autocomplete="new-password">
              <button type="button" class="password-toggle" data-toggle-password="reg-confirm" aria-label="إظهار كلمة المرور">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-check mt-4">
          <input class="form-check-input" type="checkbox" id="reg-terms" name="terms" data-validate="required">
          <label class="form-check-label small" for="reg-terms">
            أوافق على <a href="#" class="fw-bold">الشروط والأحكام</a> و<a href="#" class="fw-bold">سياسة الخصوصية</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg mt-4" id="register-submit">
          <i class="bi bi-person-plus me-1"></i>إنشاء الحساب
        </button>
      </form>

      <div class="auth-footer-links">
        لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
</body>
</html>
