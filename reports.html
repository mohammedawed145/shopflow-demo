<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقارير | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="app-body" data-page="reports">

  <div id="app-shell">
    <main class="app-content" id="app-content">

      <div class="page-header">
        <div>
          <div id="sf-breadcrumb"></div>
          <h1 class="page-title">التقارير</h1>
          <p class="page-subtitle">تقارير المبيعات والأرباح والمخزون والديون والمصروفات</p>
        </div>
      </div>

      <!-- شريط الفلاتر والأدوات -->
      <div class="card mb-3 no-print">
        <div class="card-body d-flex flex-wrap gap-2 align-items-end">
          <div>
            <label class="form-label" for="report-from">من تاريخ</label>
            <input type="date" class="form-control" id="report-from">
          </div>
          <div>
            <label class="form-label" for="report-to">إلى تاريخ</label>
            <input type="date" class="form-control" id="report-to">
          </div>
          <button class="btn btn-primary" type="button" id="report-apply">
            <i class="bi bi-funnel me-1"></i>تطبيق الفلاتر
          </button>
          <div class="ms-auto d-flex gap-2">
            <button class="btn btn-soft-secondary" type="button" id="report-export">
              <i class="bi bi-filetype-csv me-1"></i>تصدير CSV (Excel)
            </button>
            <button class="btn btn-primary" type="button" id="report-print">
              <i class="bi bi-printer me-1"></i>طباعة / PDF
            </button>
          </div>
        </div>
      </div>

      <!-- أقسام التقارير -->
      <ul class="nav nav-tabs mb-3 no-print" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-sales" data-tab="sales" type="button" role="tab">
            <i class="bi bi-receipt me-1"></i>المبيعات
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-profit" data-tab="profit" type="button" role="tab">
            <i class="bi bi-graph-up-arrow me-1"></i>الأرباح
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-inventory" data-tab="inventory" type="button" role="tab">
            <i class="bi bi-boxes me-1"></i>المخزون
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-top" data-tab="top-products" type="button" role="tab">
            <i class="bi bi-star me-1"></i>الأكثر مبيعًا
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-debts" data-tab="debts" type="button" role="tab">
            <i class="bi bi-wallet2 me-1"></i>الديون
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-expenses" data-tab="expenses" type="button" role="tab">
            <i class="bi bi-cash-coin me-1"></i>المصروفات
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-sales" role="tabpanel">
          <div class="report-body" id="report-body-sales"></div>
        </div>
        <div class="tab-pane fade" id="tab-profit" role="tabpanel">
          <div class="report-body" id="report-body-profit"></div>
        </div>
        <div class="tab-pane fade" id="tab-inventory" role="tabpanel">
          <div class="report-body" id="report-body-inventory"></div>
        </div>
        <div class="tab-pane fade" id="tab-top" role="tabpanel">
          <div class="report-body" id="report-body-top-products"></div>
        </div>
        <div class="tab-pane fade" id="tab-debts" role="tabpanel">
          <div class="report-body" id="report-body-debts"></div>
        </div>
        <div class="tab-pane fade" id="tab-expenses" role="tabpanel">
          <div class="report-body" id="report-body-expenses"></div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/reports.js"></script>
</body>
</html>
