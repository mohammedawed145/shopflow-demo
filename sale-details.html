<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الفاتورة | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="app-body" data-page="sale-details">

  <div id="app-shell">
    <main class="app-content" id="app-content">

      <div class="page-header">
        <div>
          <div id="sf-breadcrumb"></div>
          <h1 class="page-title" id="sale-title">تفاصيل الفاتورة</h1>
          <p class="page-subtitle">عرض الفاتورة وطباعتها وتسجيل الدفعات</p>
        </div>
        <div class="page-actions no-print">
          <a class="btn btn-soft-secondary" href="sales.html"><i class="bi bi-arrow-right me-1"></i>العودة</a>
          <button class="btn btn-soft-danger" type="button" id="btn-cancel-sale" data-roles="owner,admin">
            <i class="bi bi-x-circle me-1"></i>إلغاء الفاتورة
          </button>
          <button class="btn btn-soft-primary" type="button" id="btn-add-payment">
            <i class="bi bi-cash-coin me-1"></i>تسجيل دفعة
          </button>
          <button class="btn btn-primary" type="button" id="btn-print-sale">
            <i class="bi bi-printer me-1"></i>طباعة / PDF
          </button>
        </div>
      </div>

      <div id="invoice-box"></div>

      <!-- نافذة تسجيل دفعة على الفاتورة -->
      <div class="modal fade" id="sale-payment-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <form id="sale-payment-form" novalidate>
              <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-cash-coin me-1 text-success"></i>تسجيل دفعة</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
              </div>
              <div class="modal-body">
                <p class="mb-3">المتبقي على الفاتورة: <strong class="text-danger" id="sdp-remaining">—</strong></p>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="sdp-amount">المبلغ <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="sdp-amount" name="amount" min="0" step="0.01"
                           placeholder="0.00" data-validate="required|number|minValue:0.01">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="sdp-method">طريقة الدفع</label>
                    <select class="form-select" id="sdp-method" name="method">
                      <option value="cash">نقدي</option>
                      <option value="card">بطاقة</option>
                      <option value="transfer">تحويل بنكي</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="sdp-notes">ملاحظات</label>
                    <input type="text" class="form-control" id="sdp-notes" name="notes" placeholder="ملاحظة اختيارية">
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-soft-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="submit" class="btn btn-success" id="sdp-save-btn"><i class="bi bi-check-lg me-1"></i>تسجيل الدفعة</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/sales.js"></script>
</body>
</html>
