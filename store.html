<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتجر الإلكتروني | ShopFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="store-body" data-page="store">

  <div id="store-shell">
    <main>

      <div class="container-xl">

        <!-- واجهة ترحيبية -->
        <section class="store-hero text-center">
          <h2 id="store-hero-title">أهلًا بك في متجرنا</h2>
          <p>تسوق من منتجاتنا الأصلية بأسعار منافسة، مع إمكانية الاستلام من المتجر أو التوصيل</p>
        </section>

        <!-- تصنيفات المنتجات -->
        <div class="category-chips" id="store-chips"></div>

        <!-- شبكة المنتجات -->
        <div class="row g-3 mb-4 row-cols-2 row-cols-md-3 row-cols-xl-4" id="store-products"></div>

        <!-- عرض المزيد -->
        <div class="text-center mb-5 d-none" id="store-more-box">
          <button type="button" class="btn btn-soft-primary px-4" id="store-more">
            <i class="bi bi-chevron-double-down me-1"></i>عرض المزيد
          </button>
        </div>

      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/store.js"></script>
</body>
</html>
